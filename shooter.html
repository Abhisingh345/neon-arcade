<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Space Shooter – Neon Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030712;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;}
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0.8rem 2rem;background:rgba(3,7,18,0.9);border-bottom:1px solid rgba(255,0,110,0.2);z-index:10;flex-shrink:0;}
.logo{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;background:linear-gradient(135deg,#00f5ff,#bf00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back{color:#ff006e;text-decoration:none;font-size:0.85rem;font-weight:600;letter-spacing:1px;}
.hud{display:flex;gap:2rem;align-items:center;padding:0.5rem 2rem;width:100%;background:rgba(3,7,18,0.7);flex-shrink:0;}
.hud-item{display:flex;align-items:center;gap:0.5rem;font-family:'Orbitron',monospace;font-size:0.85rem;}
.hud-label{color:#475569;font-size:0.7rem;letter-spacing:1px;}
.hud-val{color:#fff;font-weight:700;}
#score-val{color:#ffd60a;}
#wave-val{color:#00f5ff;}
#lives-val{color:#ff006e;}
.health-bar{width:100px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
.health-fill{height:100%;background:linear-gradient(90deg,#ff006e,#bf00ff);border-radius:4px;transition:width 0.2s;}
canvas{display:block;border:1px solid rgba(255,0,110,0.2);box-shadow:0 0 40px rgba(255,0,110,0.1);}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,7,18,0.92);z-index:100;gap:1rem;}
#overlay h2{font-family:'Orbitron',monospace;font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#ff006e,#bf00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#overlay p{color:#64748b;font-size:0.95rem;max-width:340px;text-align:center;line-height:1.6;}
#start-btn{padding:0.9rem 2.5rem;border:none;border-radius:12px;background:linear-gradient(135deg,#ff006e,#bf00ff);color:#fff;font-family:'Orbitron',monospace;font-size:0.9rem;font-weight:700;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 24px rgba(255,0,110,0.4);transition:transform 0.2s,opacity 0.2s;}
#start-btn:hover{transform:scale(1.06);opacity:0.9;}
.controls{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.key{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:0.3rem 0.7rem;font-size:0.78rem;color:#94a3b8;}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ NEON ARCADE</div>
  <a href="index.html" class="back">← Back to Arcade</a>
</header>
<div class="hud">
  <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-val" id="score-val">0</span></div>
  <div class="hud-item"><span class="hud-label">WAVE</span><span class="hud-val" id="wave-val">1</span></div>
  <div class="hud-item"><span class="hud-label">LIVES</span><span class="hud-val" id="lives-val">❤️❤️❤️</span></div>
  <div class="hud-item"><span class="hud-label">HEALTH</span><div class="health-bar"><div class="health-fill" id="health-fill" style="width:100%"></div></div></div>
  <div class="hud-item"><span class="hud-label">HIGH SCORE</span><span class="hud-val" id="hi-val" style="color:#00f5ff">0</span></div>
</div>
<canvas id="c"></canvas>

<div id="overlay">
  <h2>🚀 SPACE SHOOTER</h2>
  <p>Blast through enemy waves. Collect power-ups. Survive the boss!</p>
  <div class="controls">
    <span class="key">← → Move</span>
    <span class="key">SPACE Shoot</span>
    <span class="key">P Pause</span>
  </div>
  <button id="start-btn" onclick="startGame()">START GAME</button>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){
  const h=window.innerHeight-document.querySelector('header').offsetHeight-document.querySelector('.hud').offsetHeight;
  canvas.width=Math.min(700,window.innerWidth);
  canvas.height=Math.max(400,h-4);
}
resize();
window.addEventListener('resize',()=>{resize();});

// State
let player,bullets,enemies,eBullets,particles,powerups,boss;
let score,hiScore=0,wave,lives,paused,gameOver,gameStarted,lastTime,bossSpawned;
let keys={};

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();}
  if(e.code==='KeyP'&&gameStarted&&!gameOver){paused=!paused;if(!paused)requestAnimationFrame(loop);}
});
document.addEventListener('keyup',e=>keys[e.code]=false);

// Touch controls
let touchX=null;
canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{ passive:true});
canvas.addEventListener('touchmove',e=>{
  if(touchX!==null){const dx=e.touches[0].clientX-touchX;touchX=e.touches[0].clientX;if(player)player.x=Math.max(20,Math.min(canvas.width-20,player.x+dx*1.5));}
},{passive:true});
canvas.addEventListener('touchend',()=>{if(gameStarted&&!gameOver){shoot();}});

function startGame(){
  document.getElementById('overlay').style.display='none';
  score=0;wave=1;lives=3;paused=false;gameOver=false;gameStarted=true;bossSpawned=false;
  player={x:canvas.width/2,y:canvas.height-60,w:28,h:32,speed:5,hp:100,maxHp:100,shootCD:0,shield:false,shieldT:0,rapid:false,rapidT:0};
  bullets=[];enemies=[];eBullets=[];particles=[];powerups=[];boss=null;
  spawnWave();lastTime=performance.now();
  updateHUD();requestAnimationFrame(loop);
}

function spawnWave(){
  document.getElementById('wave-val').textContent=wave;
  const count=5+wave*2;
  for(let i=0;i<count;i++){
    const type=wave>=3&&Math.random()<0.3?'tank':wave>=2&&Math.random()<0.3?'fast':'basic';
    enemies.push({
      x:40+Math.random()*(canvas.width-80),y:-30-i*50,
      w:type==='tank'?34:24,h:type==='tank'?34:24,
      hp:type==='tank'?5:type==='fast'?1:2,
      speed:(type==='fast'?2.5:1.2)+wave*0.15,
      shootCD:0,shootRate:Math.floor(60+Math.random()*80),
      color:type==='tank'?'#bf00ff':type==='fast'?'#ffd60a':'#ff006e',
      type,dx:(Math.random()-0.5)*1.5
    });
  }
}

function spawnBoss(){
  boss={x:canvas.width/2,y:80,w:70,h:50,hp:30+wave*10,maxHp:30+wave*10,speed:1.5,dir:1,shootCD:0,phase:0};
  bossSpawned=true;
}

function shoot(){
  const rate=player.rapid?6:14;
  if(player.shootCD>0)return;
  bullets.push({x:player.x,y:player.y-20,speed:10,w:4,h:14,color:'#00f5ff'});
  if(player.rapid){
    bullets.push({x:player.x-12,y:player.y-10,speed:10,w:3,h:10,color:'#00f5ff'});
    bullets.push({x:player.x+12,y:player.y-10,speed:10,w:3,h:10,color:'#00f5ff'});
  }
  player.shootCD=rate;
}

function spawnParticles(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const angle=Math.random()*Math.PI*2,speed=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:col,size:Math.random()*4+1});
  }
}

function spawnPowerup(x,y){
  if(Math.random()>0.25)return;
  const types=['rapid','shield','health'];
  const t=types[Math.floor(Math.random()*types.length)];
  const colors={rapid:'#ffd60a',shield:'#00f5ff',health:'#00ff88'};
  powerups.push({x,y,t,color:colors[t],vy:1.5,size:14,angle:0});
}

function collide(a,b){return Math.abs(a.x-b.x)<(a.w||a.size||8)/2+(b.w||b.size||8)/2&&Math.abs(a.y-b.y)<(a.h||a.size||8)/2+(b.h||b.size||8)/2;}

function loop(ts){
  if(paused||gameOver)return;
  const dt=Math.min((ts-lastTime)/16.67,3);lastTime=ts;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // BG
  ctx.fillStyle='#030712';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawStars();

  // Player input
  if((keys['ArrowLeft']||keys['KeyA'])&&player.x>20)player.x-=player.speed*dt;
  if((keys['ArrowRight']||keys['KeyD'])&&player.x<canvas.width-20)player.x+=player.speed*dt;
  if(keys['Space'])shoot();
  if(player.shootCD>0)player.shootCD-=dt;
  if(player.rapid){player.rapidT-=dt;if(player.rapidT<=0)player.rapid=false;}
  if(player.shield){player.shieldT-=dt;if(player.shieldT<=0)player.shield=false;}

  // Bullets
  bullets=bullets.filter(b=>{
    b.y-=b.speed*dt;
    // vs enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){
        e.hp--;spawnParticles(e.x,e.y,e.color,6);
        if(e.hp<=0){score+=e.type==='tank'?30:e.type==='fast'?20:10;spawnPowerup(e.x,e.y);spawnParticles(e.x,e.y,e.color,20);enemies.splice(i,1);}
        return false;
      }
    }
    // vs boss
    if(boss){
      if(Math.abs(b.x-boss.x)<boss.w/2&&Math.abs(b.y-boss.y)<boss.h/2){
        boss.hp--;spawnParticles(b.x,b.y,'#ff006e',4);
        if(boss.hp<=0){score+=500;spawnParticles(boss.x,boss.y,'#ff006e',60);boss=null;bossSpawned=false;wave++;spawnWave();}
        return false;
      }
    }
    return b.y>-20;
  });

  // Enemies
  enemies.forEach(e=>{
    e.x+=e.dx*dt;e.y+=e.speed*dt;
    if(e.x<20||e.x>canvas.width-20)e.dx*=-1;
    e.shootCD++;
    if(e.shootCD>=e.shootRate){e.shootCD=0;eBullets.push({x:e.x,y:e.y+e.h/2,speed:3+wave*0.2,color:e.color});}
    if(e.y>canvas.height+40){lives--;if(lives<0)lives=0;updateHUD();}
  });
  enemies=enemies.filter(e=>e.y<canvas.height+60);

  // Boss
  if(boss){
    boss.x+=boss.speed*boss.dir*dt;
    if(boss.x>canvas.width-60||boss.x<60)boss.dir*=-1;
    boss.shootCD+=dt;
    const rate=boss.hp<boss.maxHp/2?20:35;
    if(boss.shootCD>=rate){
      boss.shootCD=0;
      for(let a=-30;a<=30;a+=15)eBullets.push({x:boss.x,y:boss.y+boss.h/2,speed:3,color:'#bf00ff',vx:Math.sin(a*Math.PI/180)*3});
    }
  }

  // Enemy bullets
  eBullets=eBullets.filter(b=>{
    b.y+=b.speed*dt;if(b.vx)b.x+=b.vx*dt;
    if(!player.shield&&Math.abs(b.x-player.x)<18&&Math.abs(b.y-player.y)<22){
      player.hp-=10;spawnParticles(player.x,player.y,'#fff',6);
      if(player.hp<=0){player.hp=0;lives--;player.hp=100;if(lives<=0){endGame();}}
      updateHUD();return false;
    }
    return b.y<canvas.height+10&&b.x>-10&&b.x<canvas.width+10;
  });

  // Powerups
  powerups=powerups.filter(p=>{
    p.y+=p.vy*dt;p.angle+=0.05*dt;
    if(Math.abs(p.x-player.x)<28&&Math.abs(p.y-player.y)<28){
      if(p.t==='rapid'){player.rapid=true;player.rapidT=300;}
      else if(p.t==='shield'){player.shield=true;player.shieldT=300;}
      else{player.hp=Math.min(player.maxHp,player.hp+40);}
      updateHUD();return false;
    }
    return p.y<canvas.height+20;
  });

  // Particles
  particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.1*dt;p.life-=0.03*dt;return p.life>0;});

  // Wave clear
  if(enemies.length===0&&!bossSpawned){
    if(wave%3===0)spawnBoss();
    else{wave++;spawnWave();}
    document.getElementById('wave-val').textContent=wave;
  }

  // Lives check
  if(lives<=0){endGame();return;}

  // --- DRAW ---
  drawParticles();drawPowerups();drawEnemies();drawBoss();drawEBullets();drawBullets();drawPlayer();drawBossHP();
  updateHUD();
  requestAnimationFrame(loop);
}

const starField=Array.from({length:80},()=>({x:Math.random()*700,y:Math.random()*800,s:Math.random()*1.5+0.3,speed:Math.random()*0.5+0.2}));
function drawStars(){
  starField.forEach(s=>{
    s.y+=s.speed;if(s.y>canvas.height)s.y=0;
    ctx.fillStyle=`rgba(255,255,255,${s.s*0.6})`;
    ctx.beginPath();ctx.arc(s.x%canvas.width,s.y,s.s*0.7,0,Math.PI*2);ctx.fill();
  });
}

function drawPlayer(){
  const x=player.x,y=player.y;
  // shield
  if(player.shield){
    ctx.beginPath();ctx.arc(x,y,36,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,245,255,0.5)';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(0,245,255,0.07)';ctx.fill();
  }
  // ship body
  ctx.save();ctx.translate(x,y);
  // engine glow
  const grad=ctx.createRadialGradient(0,20,2,0,20,18);
  grad.addColorStop(0,'rgba(0,245,255,0.9)');grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,20,10,16,0,0,Math.PI*2);ctx.fill();
  // main hull
  ctx.fillStyle='#0d2040';
  ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(16,14);ctx.lineTo(8,20);ctx.lineTo(-8,20);ctx.lineTo(-16,14);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#00f5ff';ctx.lineWidth=1.5;ctx.stroke();
  // cockpit
  ctx.fillStyle='rgba(0,245,255,0.4)';
  ctx.beginPath();ctx.ellipse(0,-6,6,10,0,0,Math.PI*2);ctx.fill();
  // rapid indicator
  if(player.rapid){ctx.fillStyle='#ffd60a';ctx.font='10px Orbitron';ctx.textAlign='center';ctx.fillText('⚡',0,-36);}
  ctx.restore();
}

function drawEnemies(){
  enemies.forEach(e=>{
    ctx.save();ctx.translate(e.x,e.y);
    const g=ctx.createRadialGradient(0,0,4,0,0,e.w);
    g.addColorStop(0,e.color);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,e.w,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0d0520';
    if(e.type==='tank'){
      ctx.beginPath();ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,e.h/2);ctx.lineTo(-e.w/2,e.h/2);ctx.closePath();ctx.fill();
      ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.stroke();
    }else{
      ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(e.w/2,-e.h/2);ctx.lineTo(-e.w/2,-e.h/2);ctx.closePath();ctx.fill();
      ctx.strokeStyle=e.color;ctx.lineWidth=1.5;ctx.stroke();
    }
    // HP bar
    if(e.hp>1){
      const bw=e.w*1.2;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-bw/2,e.h/2+4,bw,4);
      ctx.fillStyle=e.color;ctx.fillRect(-bw/2,e.h/2+4,bw*(e.hp/(e.type==='tank'?5:2)),4);
    }
    ctx.restore();
  });
}

function drawBoss(){
  if(!boss)return;
  ctx.save();ctx.translate(boss.x,boss.y);
  // glow
  const g=ctx.createRadialGradient(0,0,10,0,0,60);
  g.addColorStop(0,'rgba(191,0,255,0.4)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,60,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle='#1a0030';
  ctx.beginPath();ctx.moveTo(0,-boss.h/2);ctx.lineTo(boss.w/2,boss.h/2);ctx.lineTo(0,boss.h/3);ctx.lineTo(-boss.w/2,boss.h/2);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#bf00ff';ctx.lineWidth=2;ctx.stroke();
  // core
  const pulse=0.8+Math.sin(Date.now()*0.005)*0.2;
  ctx.fillStyle=`rgba(191,0,255,${pulse})`;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
  // label
  ctx.fillStyle='#bf00ff';ctx.font='bold 11px Orbitron';ctx.textAlign='center';ctx.fillText('BOSS',0,-boss.h/2-12);
  ctx.restore();
}

function drawBossHP(){
  if(!boss)return;
  const bw=canvas.width*0.6,bh=10,bx=(canvas.width-bw)/2,by=8;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.fill();
  const pct=boss.hp/boss.maxHp;
  const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff006e');g.addColorStop(1,'#bf00ff');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(bx,by,bw*pct,bh,5);ctx.fill();
  ctx.fillStyle='#bf00ff';ctx.font='9px Orbitron';ctx.textAlign='center';ctx.fillText('BOSS HP',canvas.width/2,by+bh+12);
}

function drawBullets(){
  bullets.forEach(b=>{
    const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y-b.h);
    g.addColorStop(0,b.color);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.shadowColor=b.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.roundRect(b.x-b.w/2,b.y-b.h,b.w,b.h,2);ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawEBullets(){
  eBullets.forEach(b=>{
    ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawPowerups(){
  powerups.forEach(p=>{
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.t==='rapid'?'⚡':p.t==='shield'?'🛡️':'❤️',0,0);
    ctx.restore();
  });
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('lives-val').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('health-fill').style.width=(player?player.hp:100)+'%';
  if(score>hiScore){hiScore=score;document.getElementById('hi-val').textContent=hiScore;}
}

function endGame(){
  gameOver=true;gameStarted=false;
  if(score>hiScore)hiScore=score;
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.querySelector('h2').textContent='💀 GAME OVER';
  ov.querySelector('p').textContent=`Final Score: ${score} | High Score: ${hiScore}`;
  document.getElementById('start-btn').textContent='PLAY AGAIN';
}
</script>
</body>
</html>
